services:
  postgres:
    image: postgres:17
    container_name: lanchonete-postgres
    environment:
      POSTGRES_USER: lanchonete
      POSTGRES_PASSWORD: lanchonete
      POSTGRES_DB: lanchonete_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanchonete -d lanchonete_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
